name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test:ci
      # FAB-18: the JUnit report is published on every run, failed runs included.
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: robotesta-test-results-test
          path: test-results
          retention-days: 7
